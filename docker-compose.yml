services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: short-drama-mysql
    environment:
      MYSQL_DATABASE: drama
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-mysql123}
      MYSQL_USER: drama
      MYSQL_PASSWORD: ${DB_PASSWORD:-mysql123}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-mysql123}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - drama-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: short-drama-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - drama-network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: short-drama-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - drama-network

  # RabbitMQ for Celery
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: short-drama-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-password}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - drama-network

  # Java Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drama-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/drama?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-mysql123}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-drama-files}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-min-32-chars-long}
      AI_SERVICE_URL: http://ai-service:8000
      SERVICE_API_TOKEN: ${SERVICE_API_TOKEN:-internal-dev-token}
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Duser.timezone=Asia/Shanghai"
      SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_TIME_ZONE: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - drama-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Python AI Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: drama-ai-service
    environment:
      DATABASE_URL: mysql://root:${DB_PASSWORD:-mysql123}@mysql:3306/drama
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-drama-files}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-password}@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SERVICE_API_TOKEN: ${SERVICE_API_TOKEN:-internal-dev-token}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - drama-network
    restart: unless-stopped

  # Celery Worker
  celery-worker:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: drama-celery-worker
    command: celery -A app.core.celery worker --loglevel=info
    healthcheck:
      test: celery -A app.core.celery inspect ping -d celery@$$HOSTNAME
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    environment:
      DATABASE_URL: mysql://root:${DB_PASSWORD:-mysql123}@mysql:3306/drama
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-drama-files}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-password}@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JAVA_BACKEND_URL: http://backend:8080
      SERVICE_API_TOKEN: ${SERVICE_API_TOKEN:-internal-dev-token}
    depends_on:
      - rabbitmq
      - redis
      - mysql
      - ai-service
      - backend
    networks:
      - drama-network
    restart: unless-stopped

  celery-beat:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: drama-celery-beat
    command: celery -A app.core.celery beat --loglevel=info --scheduler celery.beat.PersistentScheduler
    healthcheck:
      test: celery -A app.core.celery status
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    environment:
      DATABASE_URL: mysql://root:${DB_PASSWORD:-mysql123}@mysql:3306/drama
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-drama-files}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-password}@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JAVA_BACKEND_URL: http://backend:8080
      SERVICE_API_TOKEN: ${SERVICE_API_TOKEN:-internal-dev-token}
    depends_on:
      - rabbitmq
      - redis
      - mysql
      - ai-service
      - celery-worker
      - backend
    networks:
      - drama-network
    restart: unless-stopped

  # Frontend Nginx
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: drama-nginx
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - drama-network
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  minio_data:
  rabbitmq_data:

networks:
  drama-network:
    driver: bridge
